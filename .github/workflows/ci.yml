name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_evals:
        description: Run synthetic evaluations with the configured model
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commerceops_test
          POSTGRES_USER: commerceops
          POSTGRES_PASSWORD: commerceops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerceops -d commerceops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Typecheck
        run: python -m mypy src

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://commerceops:commerceops@localhost:5432/commerceops_test
        run: alembic upgrade head

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://commerceops:commerceops@localhost:5432/commerceops_test
          TEST_REDIS_URL: redis://localhost:6379/15
        run: python -m pytest tests/unit tests/integration tests/contract

      - name: Evaluation scorer tests
        env:
          LANGSMITH_TRACING: "false"
        run: python -m pytest tests/evals

      - name: Replay evaluations
        env:
          TEST_DATABASE_URL: postgresql+psycopg://commerceops:commerceops@localhost:5432/commerceops_test
          LANGSMITH_TRACING: "false"
        run: python -m commerceops.evals.runner --mode replay --output evals/reports/replay.json

      - name: Live agent evaluations
        if: github.event_name == 'workflow_dispatch' && inputs.run_live_evals
        env:
          TEST_DATABASE_URL: postgresql+psycopg://commerceops:commerceops@localhost:5432/commerceops_test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: commerceops-ai-m8
          LANGSMITH_TRACING: "true"
        run: python -m commerceops.evals.runner --mode live --concurrency 4 --output evals/reports/live.json

      - name: Evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: evals/reports/*.json
          if-no-files-found: ignore

      - name: Docker build
        run: docker build --pull --tag commerceops-ai:ci .
